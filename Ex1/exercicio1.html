<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Overtime Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neo-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(99, 102, 241, 0.2); color: #fff; transition: all 0.3s ease; }
        .neo-input:focus { border-color: #6366f1; box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); outline: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-[#0b0f1a] min-h-screen flex items-center justify-center font-sans">
    <div class="relative w-full max-w-lg p-[1px] rounded-[2rem] bg-gradient-to-b from-indigo-500/50 to-transparent text-white">
        <div class="bg-[#0f172a] rounded-[2rem] p-10 relative overflow-hidden">
            <a href="../index.html" class="text-slate-500 hover:text-indigo-400 text-xs font-bold uppercase tracking-widest transition-colors">
                < [ESC] Dash_Central
            </a>
            <div class="mt-8 mb-10">
                <h2 class="text-3xl font-black uppercase tracking-tighter">Overtime Engine</h2>
                <div class="h-1 w-12 bg-indigo-500 mt-2"></div>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] uppercase font-bold text-slate-500 tracking-widest ml-1 mb-2 block">Salário Bruto</label>
                    <input type="number" id="salario" class="neo-input w-full p-4 rounded-xl text-lg font-mono" placeholder="R$ 0,00">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] uppercase font-bold text-slate-500 tracking-widest ml-1 mb-2 block">H. Úteis (50%)</label>
                        <input type="number" id="hUteis" class="neo-input w-full p-4 rounded-xl font-mono" placeholder="0">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-bold text-slate-500 tracking-widest ml-1 mb-2 block">H. FDS (100%)</label>
                        <input type="number" id="hFDS" class="neo-input w-full p-4 rounded-xl font-mono" placeholder="0">
                    </div>
                </div>
                <button onclick="runProcess()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-black py-5 rounded-xl transition-all shadow-[0_10px_30px_rgba(79,70,229,0.3)] active:scale-[0.98] uppercase tracking-[0.2em] text-sm">
                    Calcular Pagamento
                </button>
                <div id="terminal" class="hidden mt-8 p-6 rounded-xl bg-black/40 border border-white/5 font-mono text-[11px]">
                    <p class="text-slate-600 mb-2 uppercase">[ TIMESTAMP: <span id="timestamp"></span> ]</p>
                    <p class="text-indigo-400 animate-pulse mb-2">>> DATA_CONSOLIDATED</p>
                    <p class="text-slate-400 uppercase">Total de Horas Extras:</p>
                    <p id="totalOutput" class="text-3xl font-bold mt-2 text-white"></p>
                </div>
            </div>
        </div>
    </div>
    <script>
        function runProcess() {
            const salario = parseFloat(document.getElementById('salario').value);
            const hUteis = parseFloat(document.getElementById('hUteis').value) || 0;
            const hFDS = parseFloat(document.getElementById('hFDS').value) || 0;

            if (!salario || salario <= 0) return alert("Insira um salário válido.");

            const valorHora = salario / 200;
            const total = (hUteis * (valorHora * 1.5)) + (hFDS * (valorHora * 2));

            document.getElementById('timestamp').innerText = new Date().toLocaleString('pt-BR');
            document.getElementById('terminal').classList.remove('hidden');
            document.getElementById('totalOutput').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
        document.addEventListener('keydown', (e) => { if (e.key === "Escape") window.location.href = "../index.html"; });
    </script>
</body>
</html>
