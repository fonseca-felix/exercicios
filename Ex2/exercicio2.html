<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> Growth Matrix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neo-input { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(16, 185, 129, 0.2); color: #fff; transition: all 0.3s ease; }
        .neo-input:focus { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); outline: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-[#0b0f1a] min-h-screen flex items-center justify-center font-sans">
    <div class="relative w-full max-w-lg p-[1px] rounded-[2rem] bg-gradient-to-b from-emerald-500/50 to-transparent text-white">
        <div class="bg-[#0f172a] rounded-[2rem] p-10 relative overflow-hidden">
            <a href="../index.html" class="text-slate-500 hover:text-emerald-400 text-xs font-bold uppercase tracking-widest transition-colors">
                < [ESC] Dash_Central
            </a>
            <div class="mt-8 mb-10">
                <h2 class="text-3xl font-black uppercase tracking-tighter">Growth Matrix</h2>
                <div class="h-1 w-12 bg-emerald-500 mt-2"></div>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] uppercase font-bold text-slate-500 tracking-widest ml-1 mb-2 block">Salário Atual</label>
                    <input type="number" id="salario" class="neo-input w-full p-4 rounded-xl text-lg font-mono" placeholder="R$ 0,00">
                </div>
                <button onclick="processGrowth()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-5 rounded-xl transition-all shadow-[0_10px_30px_rgba(16,185,129,0.2)] active:scale-[0.98] uppercase tracking-[0.2em] text-sm">
                    Executar Cálculos
                </button>
                <div id="terminal" class="hidden mt-8 p-6 rounded-xl bg-black/40 border border-white/5 font-mono text-[11px]">
                    <p class="text-slate-500 mb-2 uppercase">[ LOG_TIME: <span id="timestamp"></span> ]</p>
                    <p class="text-emerald-400 animate-pulse mb-2">>> ANALYSIS_COMPLETE</p>
                    <p class="text-slate-400 uppercase">Novo Salário Reajustado:</p>
                    <p id="totalOutput" class="text-3xl font-bold mt-2 text-white"></p>
                </div>
            </div>
        </div>
    </div>
    <script>
        function processGrowth() {
            const salario = parseFloat(document.getElementById('salario').value);
            if (!salario || salario <= 0) return alert("Insira um salário válido.");

            let taxa = salario <= 1200 ? 0.16 : salario <= 2100 ? 0.13 : salario <= 3000 ? 0.10 : 0.05;
            const novoSalario = salario * (1 + taxa);

            document.getElementById('timestamp').innerText = new Date().toLocaleString('pt-BR');
            document.getElementById('terminal').classList.remove('hidden');
            document.getElementById('totalOutput').innerText = novoSalario.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }
        document.addEventListener('keydown', (e) => { if (e.key === "Escape") window.location.href = "../index.html"; });
    </script>
</body>
</html>
